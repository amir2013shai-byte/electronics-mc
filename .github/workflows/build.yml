name: build

# Собирает плагин и ресурспак, прогоняет офлайн-тесты и сверку ссылок пака.
# На теге v* дополнительно выкладывает GitHub Release с артефактами.
#
# Зачем: build/ и plugin/target/ не переживают пересоздание песочницы, а артефакты
# нужны постоянные. Пусть их собирает GitHub.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно только для шага "GitHub Release" на теге
    env:
      SPIGOT_API: 1.21.11-R0.2-SNAPSHOT
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 + кэш ~/.m2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Python + Pillow (нужен генератор текстур)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet Pillow

      - name: Плагин
        working-directory: plugin
        run: mvn -B -ntp -DskipTests package

      - name: Ресурспак, датапак, превью, артефакты в release/
        run: bash tools/publish.sh

      - name: Тесты ядра + сверка ссылок пака
        run: bash tools/run_tests.sh

      - name: Проверка, что ресурспак совпадает с pack_format 75
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open('build/resourcepack/pack.mcmeta'))
          pf = m['pack']['pack_format']
          assert pf == 75, f"pack_format={pf}, ждали 75 (1.21.11)"
          print("pack_format:", pf, "| supported_formats:", m['pack'].get('supported_formats'))
          PY

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: electronics-1.21.11
          path: |
            release/Electronics-1.0.0.jar
            release/electronics-resourcepack.zip
            release/electronics-recipes-datapack.zip
            release/preview.png
            release/sha1sums.txt
            release/textures/*.png
          if-no-files-found: error

      # ВАЖНО: permissions на уровне *шага* GitHub не принимает (ран падает ещё
      # до запуска джоба с сообщением «Invalid workflow file»). Права на создание
      # релиза объявлены на уровне job — их хватает.
      - name: GitHub Release (только на теге v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Идемпотентность важна: релиз на тот же тег уже мог выложить
          # tools/release.sh (это штатный путь — артефакты нужны сразу). Тогда
          # gh release create вернёт 422 «already exists», и шаг обязан
          # перезаписать ассеты, а не уронить весь ран.
          ASSETS="release/Electronics-1.0.0.jar release/electronics-resourcepack.zip
          release/electronics-recipes-datapack.zip release/preview.png release/sha1sums.txt
          release/textures/sheet-01.png release/textures/sheet-02.png
          release/textures/sheet-03.png release/textures/sheet-04.png
          release/textures/sheet-05.png release/textures/sheet-06.png
          release/textures/sheet-07.png release/textures/sheet-08.png"
          NOTES="Плагин собран против spigot-api $SPIGOT_API, ресурспак — pack_format 75.
          Ставить: jar в \`plugins/\`, архив — в \`resource-pack.url\` (или вручную клиенту).
          Контрольные цифры с живого Paper 1.21.11 build 132 — в README (17 строк PASS
          в /elec selftest, 0 FAIL). Хэши — в sha1sums.txt."
          if gh release create "$GITHUB_REF_NAME" $ASSETS \
               --title "Electronics $GITHUB_REF_NAME (Minecraft 1.21.11)" --notes "$NOTES"; then
            echo "релиз создан"
          else
            echo "релиз уже есть — обновляем ассеты"
            gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber
          fi
