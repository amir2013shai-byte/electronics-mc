name: probe

# Служебный «пинг»: проверяет, что раннеры вообще запускаются (python/java на ubuntu-latest).
# Отдельный от build.yml именно поэтому: если он зелёный, а build красный — дело в содержимом build.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: версии тулчейна
        run: |
          echo "runner ok"
          python3 -V
          java -version 2>&1 | head -1
          echo "pillow:"
          python3 -c "import PIL; print(PIL.__version__)" || echo "Pillow нет (в build.yml ставится отдельно)"
