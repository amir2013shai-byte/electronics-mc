# ============================================================
#  Electronics — учебная электроника в Minecraft (Spigot 1.21.11)
#  Все значения можно менять без перезапуска: /elec reload
# ============================================================

render:
  # display — компоненты рисуются ItemDisplay-сущностями (без модов на клиенте)
  # none    — только предметы в руке/инвентаре, без визуала в мире
  mode: display
  # размер модели компонента (1.0 = блок 16x16x16)
  scale: 0.55
  # подъём модели над плоскостью платы, в блоках
  offset-y: 0.06
  # подсветка блока под горящими деталями (светодиоды, лампы)
  block-light: true
  # радиус, в котором игроку показываются модели и подписи (в блоках)
  view-range: 48.0
  # подписи значений (TextDisplay) над измерительными приборами
  text-labels: true

blocks:
  # «пустая схема»: какой vanilla-блок служит платой-основой.
  # ресурпак перекрашивает его в текстурную «стеклянную» плату.
  base: SMOOTH_QUARTZ_SLAB
  # подставка под плату (нужна, чтобы на полу не «плавать»)
  pedestal: POLISHED_BLACKSTONE
  # требовать подставку под платой: true — ставить только на полный блок
  require-pedestal: true

simulation:
  # пересчитывать цепи каждый тик (false — только по событиям: /elec sim)
  continuous: true
  # сколько компонентов обрабатывать за тик (защита от лагов на больших схемах)
  components-per-tick: 900
  # пределы одного «острова» цепи
  max-nodes-per-island: 260
  max-components-per-island: 400
  # число итераций нелинейного решателя (2 достаточно для светодиодов/транзисторов)
  solve-passes: 2
  # считать КЗ, перегрев, пробой и сгорание деталей
  faults: true
  # сопротивление «идеального» провода, Ом (1e-6 = почти КЗ-измеритель)
  conductor-ohm: 1.0e-6
  # утечка между несоединёнными узлами, Ом (держит матрицу невырожденной)
  leak-ohm: 5.0e7
  # период генератора (меандр), в тиках: 10 => 5 Гц
  generator-period-ticks: 10
  # солнечная ячейка: днём / ночью
  solar-day-voltage: 5.0
  solar-night-voltage: 0.05
  # шаг интегрирования по времени, мс (для конденсаторов)
  time-step-ms: 50
  # режим «старой скамейки»: соединения по всем 6 граням соседей
  # (легче собиракать, но закорачивает цепочки) — по умолчанию выключено,
  # используется топология «узел = пара соседних блоков»
  bench-wiring: false

world:
  # защищать блоки-платы и блоки под ними от поломки чужими
  protect-blocks: true
  # при поломке платы выдавать предмет компоненты, а не лут vanilla-блока
  drop-as-item: true
  # звуки (щелчки ключей, писк бззера, перегорание)
  sounds: true
  # подсказки в действии/чате для игроков (electronics.use)
  hints: true
  # регистрировать крафты компонентов
  recipes: true
  # в креативе выдавать все варианты /elec give
  give-in-creative: true

resource-pack:
  # автоматически отправлять пак игрокам при входе
  auto-apply: false
  # ссылка на zip (например, прямой доступ к build/electronics-resourcepack.zip)
  url: ""
  # sha1 пакета, 20 байт hex (пусто = без проверки, клиент скачает «вслепую»)
  sha1: ""

# подробный лог в консоли (ошибки решателя, тайминги)
debug: false

# Проверка сборки при старте сервера: рисует тестовую цепь в GUI-редакторе
# схемы, считает её тем же решателем, что и блоки в мире, и сверяет показания;
# плюс проверяет, что у каждого предмета есть карточка и описание в каталоге.
# В консоли будет PASS/FAIL. Ставят true обычно после обновления плагина.
selftest: false
